<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f2eb"><title>バルーンの記録</title><link rel="stylesheet" href="style.css">
<body><header><span class="brand">🎈 BALLOON ALBUM</span><h1>バルーンの記録</h1><p>作った日も、込めた想いも、写真といっしょに。</p></header><main><aside><strong>あなたの端末だけに保存します</strong><p>写真は外部へ送信しません。このブラウザのデータを消すと記録も消えます。定期的にバックアップを保存してください。別の端末への自動同期はありません。</p><button id="backup">バックアップを保存</button> <label class="button">バックアップを読み込む<input id="restore" type="file" accept="application/json,.json" hidden></label></aside><div class="toolbar"><h2>作品アルバム <small id="count"></small></h2><button id="add" class="primary" disabled>＋ 作品を登録</button></div><label class="search">作品を探す<input id="search" type="search" placeholder="作品名、目的、日付、メモで検索"></label><p id="status" role="status" aria-live="polite"></p><section id="gallery"></section></main>
<dialog id="editor"><form id="form"><div class="toolbar"><h2 id="form-title">作品を登録</h2><button type="button" id="close" aria-label="閉じる">✕</button></div><label>作品名<input name="title" required maxlength="150" placeholder="例：花束のバルーン"></label><label>作った日<input name="date" type="date"><small>昔の作品で日付がわからない場合は空欄で大丈夫です。</small></label><label>何のために作った？<input name="purpose" maxlength="300" placeholder="例：誕生日、イベント、練習"></label><label>メモ<textarea name="notes" rows="3" maxlength="10000" placeholder="使ったバルーン、工夫したところなど"></textarea></label><label>写真を追加<input id="photos" type="file" accept="image/*" multiple><small>写真を選択して追加できます。元の画像を保存します。</small></label><div id="photo-list"></div><p id="form-error" role="alert"></p><button type="submit" id="save" class="primary">保存する</button></form></dialog><script src="app.js"></script></body></html>
